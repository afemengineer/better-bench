name: Ranking diagnostic

on:
  push:
    branches:
      - bootstrap/v0

jobs:
  ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Neutral-prior nested graph validation
        run: python scripts/pairwise_prior_validation.py
      - name: Point estimator and taxonomy report
        run: python scripts/ranking_diagnostic.py
      - name: Better Bench Index report
        run: python scripts/index_report.py
