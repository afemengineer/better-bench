name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Corpus statistics
        run: python scripts/corpus_stats.py
      - name: Benchmark evidence-quality report
        run: python scripts/benchmark_quality_report.py
      - name: Model coverage-gap report
        run: python scripts/coverage_gap_report.py
      - name: Family-aware factor report
        run: python scripts/family_factor_report.py
      - name: Hierarchical estimator report
        run: python scripts/hierarchical_report.py
      - name: Hierarchical model-family cross-validation
        run: python scripts/hierarchical_cv_report.py
      - name: Factor smoke on current corpus
        run: >-
          better-bench factor
          --benchmarks data/current
          --observations data/current
          --rank 3
          --minimum-models 5
          --minimum-benchmarks 5
          --top 24
      - name: Novelty smoke on current corpus
        run: >-
          better-bench novelty
          --benchmarks data/current
          --models data/current
          --observations data/current
          --minimum-overlap 5
          --top 10
