name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Factor smoke on current corpus
        run: >-
          better-bench factor
          --benchmarks data/current
          --observations data/current
          --rank 3
          --minimum-models 5
          --minimum-benchmarks 5
          --top 10
      - name: Novelty smoke on current corpus
        run: >-
          better-bench novelty
          --benchmarks data/current
          --models data/current
          --observations data/current
          --minimum-overlap 5
          --top 10
