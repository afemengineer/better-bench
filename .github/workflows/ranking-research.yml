name: Ranking Research

on:
  push:
    branches:
      - bootstrap/v0
    paths:
      - "scripts/broad_consensus_cv.py"
      - "scripts/broad_bradley_terry_cv.py"
      - "src/better_bench/consensus_ranking.py"
      - "src/better_bench/bradley_terry.py"
      - "src/better_bench/ranking_evidence.py"
      - "tests/test_pairwise_ranking.py"
      - ".github/workflows/ranking-research.yml"

jobs:
  ranking-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: >-
          ruff check
          scripts/broad_consensus_cv.py
          scripts/broad_bradley_terry_cv.py
          src/better_bench/consensus_ranking.py
          src/better_bench/bradley_terry.py
          src/better_bench/ranking_evidence.py
          tests/test_pairwise_ranking.py
      - run: pytest -q tests/test_pairwise_ranking.py tests/test_estimator.py
      - name: Broad evidence Bradley-Terry family-CV
        run: python scripts/broad_bradley_terry_cv.py
      - name: Broad evidence Kemeny family-CV
        run: python scripts/broad_consensus_cv.py
