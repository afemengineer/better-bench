name: Ranking Research

on:
  push:
    branches:
      - bootstrap/v0
    paths:
      - "scripts/pairwise_graph_cv.py"
      - "scripts/pairwise_graph_validation.py"
      - "scripts/pairwise_prior_validation.py"
      - "scripts/ranking_cv_comparison.py"
      - "scripts/consensus_ranking_cv.py"
      - "scripts/broad_consensus_cv.py"
      - "src/better_bench/estimator.py"
      - "src/better_bench/pairwise_ranking.py"
      - "src/better_bench/consensus_ranking.py"
      - "src/better_bench/ranking_evidence.py"
      - "tests/test_pairwise_ranking.py"
      - ".github/workflows/ranking-research.yml"

jobs:
  ranking-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: >-
          ruff check
          scripts/pairwise_graph_cv.py
          scripts/pairwise_graph_validation.py
          scripts/pairwise_prior_validation.py
          scripts/ranking_cv_comparison.py
          scripts/consensus_ranking_cv.py
          scripts/broad_consensus_cv.py
          src/better_bench
          tests/test_pairwise_ranking.py
      - run: pytest -q tests/test_pairwise_ranking.py tests/test_estimator.py
      - name: Broad evidence Kemeny family-CV
        run: python scripts/broad_consensus_cv.py
      - name: Calibrated-panel Kemeny family-CV
        run: python scripts/consensus_ranking_cv.py
      - name: Fixed vs hierarchical ranking baseline
        run: python scripts/ranking_cv_comparison.py
      - name: Coverage-neutral pairwise graph
        run: python scripts/pairwise_graph_cv.py
      - name: Nested and frontier graph validation
        run: python scripts/pairwise_graph_validation.py
      - name: Neutral-prior nested graph validation
        run: python scripts/pairwise_prior_validation.py
