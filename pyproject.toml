[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "better-bench"
version = "0.1.0"
description = "Capability-oriented, uncertainty-aware aggregation of AI benchmark results"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "afemengineer" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
better-bench = "better_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/better_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/better_bench/hierarchical.py" = ["I001", "B007"]
"src/better_bench/indexing.py" = ["I001"]
